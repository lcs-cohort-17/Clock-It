<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Test - User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <script src="/assets/js/config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/store.js"></script>
</head>
<body>
    <div x-data="adminPage" class="container-fluid mt-3">
        <!-- Navigation -->
        <nav class="navbar navbar-dark bg-dark mb-4 rounded">
            <div class="container-fluid">
                <span class="navbar-brand">🔐 Clock-It Admin</span>
                <div class="d-flex align-items-center text-light">
                    <span class="me-3" x-text="$store.app.userName"></span>
                    <span class="badge bg-primary me-3" x-text="$store.app.userRole"></span>
                    <button @click="$store.app.logout()" class="btn btn-outline-light btn-sm">Logout</button>
                </div>
            </div>
        </nav>
        
        <!-- Login Form (shown when not authenticated) -->
        <div x-show="!$store.app.isAuthenticated" class="row justify-content-center">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h4>Admin Login</h4>
                        <div x-show="$store.app.error" class="alert alert-danger" x-text="$store.app.error"></div>
                        
                        <form @submit.prevent="login">
                            <input type="email" x-model="email" class="form-control mb-2" placeholder="Email" required>
                            <input type="password" x-model="password" class="form-control mb-2" placeholder="Password" required>
                            <button type="submit" class="btn btn-primary w-100" :disabled="$store.app.loading">
                                <span x-show="$store.app.loading">Loading...</span>
                                <span x-show="!$store.app.loading">Login</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Admin Panel (shown when authenticated as admin) -->
        <div x-show="$store.app.isAuthenticated && $store.app.isAdmin">
            
            <!-- Create User Form -->
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between">
                    <h5>Create New User</h5>
                    <button @click="showCreateForm = !showCreateForm" class="btn btn-sm btn-primary">
                        <span x-text="showCreateForm ? 'Cancel' : '+ New User'"></span>
                    </button>
                </div>
                <div x-show="showCreateForm" x-transition class="card-body">
                    <form @submit.prevent="createUser">
                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <input x-model="newUser.first_name" class="form-control" placeholder="First Name" required>
                            </div>
                            <div class="col-md-6 mb-2">
                                <input x-model="newUser.last_name" class="form-control" placeholder="Last Name" required>
                            </div>
                            <div class="col-md-4 mb-2">
                                <input x-model="newUser.employee_id" class="form-control" placeholder="Employee ID (e.g., A-011)">
                            </div>
                            <div class="col-md-4 mb-2">
                                <input x-model="newUser.email" type="email" class="form-control" placeholder="Email" required>
                            </div>
                            <div class="col-md-4 mb-2">
                                <select x-model="newUser.role" class="form-select" required>
                                    <option value="">Select Role</option>
                                    <option value="staff">Staff</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-success" :disabled="$store.app.loading">
                                    Create User
                                </button>
                            </div>
                        </div>
                    </form>
                    <!-- Show generated password -->
                    <div x-show="createdPassword" class="alert alert-info mt-2">
                        Generated Password: <strong x-text="createdPassword"></strong>
                    </div>
                </div>
            </div>
            
            <!-- Users Table -->
            <div class="card">
                <div class="card-header d-flex justify-content-between">
                    <h5>Users (Total: <span x-text="$store.app.users.length"></span>)</h5>
                    <button @click="refreshUsers" class="btn btn-sm btn-outline-primary" :disabled="$store.app.loading">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>
                <div class="card-body">
                    <div x-show="$store.app.loading" class="text-center py-3">
                        <div class="spinner-border text-primary"></div>
                    </div>
                    
                    <table class="table table-striped" x-show="!$store.app.loading">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Employee ID</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="user in $store.app.users" :key="user.employee_id">
                                <tr>
                                    <td x-text="user.first_name + ' ' + user.last_name"></td>
                                    <td x-text="user.email"></td>
                                    <td><code x-text="user.employee_id"></code></td>
                                    <td>
                                        <span class="badge" 
                                              :class="user.role === 'admin' ? 'bg-primary' : 'bg-secondary'"
                                              x-text="user.role">
                                        </span>
                                    </td>
                                    <td>
                                        <span class="badge" 
                                              :class="user.is_active == 1 ? 'bg-success' : 'bg-danger'"
                                              x-text="user.is_active == 1 ? 'Active' : 'Inactive'">
                                        </span>
                                    </td>
                                    <td>
                                        <button @click="toggleUserStatus(user)" 
                                                class="btn btn-sm"
                                                :class="user.is_active == 1 ? 'btn-warning' : 'btn-success'"
                                                x-text="user.is_active == 1 ? 'Deactivate' : 'Activate'">
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Not Admin Warning -->
        <div x-show="$store.app.isAuthenticated && !$store.app.isAdmin" class="alert alert-warning">
            You are logged in as staff. Admin privileges required.
        </div>
    </div>
    
    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('adminPage', () => ({
            email: 'mandisidyantyis@clockit.com',
            password: 'cSImqISd',
            showCreateForm: false,
            createdPassword: null,
            newUser: {
                first_name: '',
                last_name: '',
                employee_id: '',
                email: '',
                role: '',
                img: null
            },
            
            async login() {
                try {
                    await Alpine.store('app').login(this.email, this.password)
                    if (Alpine.store('app').isAdmin) {
                        await Alpine.store('app').fetchAllUsers()
                    }
                } catch (error) {
                    console.error(error)
                }
            },
            
            async createUser() {
                try {
                    const newUser = await Alpine.store('app').createUser(this.newUser)
                    this.createdPassword = newUser.password
                    this.newUser = { first_name: '', last_name: '', employee_id: '', email: '', role: '', img: null }
                    setTimeout(() => this.createdPassword = null, 10000)
                } catch (error) {
                    console.error(error)
                }
            },
            
            async refreshUsers() {
                await Alpine.store('app').fetchAllUsers()
            },
            
            async toggleUserStatus(user) {
                try {
                    if (user.is_active == 1) {
                        await Alpine.store('app').deactivateUser(user.employee_id)
                    } else {
                        await Alpine.store('app').activateUser(user.employee_id)
                    }
                } catch (error) {
                    console.error(error)
                }
            }
        }))
    })
    </script>
</body>
</html>
